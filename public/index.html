<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワイン抽出ツール（YouTube）</title>
<style>
  :root {
    --bg: #faf7f5;
    --card: #ffffff;
    --border: #e5dcd6;
    --text: #2b2320;
    --sub: #6d5f57;
    --accent: #8a2135;
    --accent-hover: #6f1a2b;
    --success: #197a48;
    --warn: #a86a1c;
    --error: #a11b2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    position: sticky; top: 0; z-index: 10;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .sub { font-size: 12px; color: var(--sub); }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  input[type="url"], input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 320px; }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #f3ebe6; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.ghost { background: transparent; }
  .msg { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 6px; }
  .msg.info { background: #eef4f8; color: #1e4b6b; }
  .msg.warn { background: #fdf3e5; color: var(--warn); }
  .msg.error { background: #fbe6ea; color: var(--error); }
  .meta-line { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .meta-line a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f5edea; color: var(--sub); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  td [contenteditable] {
    display: block;
    min-height: 22px;
    min-width: 40px;
    padding: 4px 6px;
    border-radius: 4px;
    outline: none;
  }
  td [contenteditable]:focus { background: #fff8e6; box-shadow: inset 0 0 0 1px var(--accent); }
  td [contenteditable]:empty::before {
    content: attr(data-placeholder);
    color: #c9bdb5;
    font-style: italic;
  }
  .row-actions button {
    padding: 4px 8px;
    font-size: 12px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .accumulated { border-top: 2px solid var(--accent); margin-top: 20px; padding-top: 12px; }
  .accumulated h2 { font-size: 14px; margin: 0 0 8px 0; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--sub); font-size: 13px; padding: 12px; text-align: center; }
  @media (max-width: 640px) {
    table { font-size: 12px; }
    th, td { padding: 4px 5px; }
    header { padding: 12px 14px 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>🍷 ワイン抽出ツール</h1>
  <div class="sub">YouTubeのブラインドテイスティング動画からワイン情報を自動で表にします</div>
</header>

<main>

  <!-- 入力カード -->
  <section class="card">
    <label for="url">YouTube URL</label>
    <div class="row">
      <div class="grow">
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      </div>
      <button id="extract" class="primary">ワインを抽出</button>
    </div>
    <div id="msg" style="display:none"></div>
    <div id="meta" class="meta-line" style="display:none"></div>
  </section>

  <!-- 今回抽出したワインの編集テーブル -->
  <section class="card" id="result-card" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong style="font-size:14px;">抽出結果（編集可）</strong>
      <button id="add-row" class="ghost">＋ 空行を追加</button>
    </div>
    <div style="overflow-x:auto">
      <table id="tbl">
        <thead>
          <tr>
            <th>ワイン名</th>
            <th>生産者</th>
            <th>品種</th>
            <th>国</th>
            <th>産地</th>
            <th>ヴィンテージ</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="toolbar">
      <button id="save-list" class="primary">この結果を一覧に保存</button>
      <button id="csv-current" class="ghost">CSVダウンロード</button>
      <button id="copy-current" class="ghost">クリップボードにコピー（TSV）</button>
    </div>
  </section>

  <!-- 保存済みワイン一覧 -->
  <section class="card accumulated" id="accum-card">
    <h2>保存済み一覧 <span id="accum-count" class="sub"></span></h2>
    <div id="accum-body"></div>
    <div class="toolbar">
      <button id="csv-all" class="ghost">全件をCSVダウンロード</button>
      <button id="copy-all" class="ghost">全件クリップボードにコピー（TSV）</button>
      <button id="clear-all" class="ghost" style="color: var(--error)">一覧をクリア</button>
    </div>
  </section>

</main>

<script>
'use strict';

const STORAGE_KEY = 'youtube-wine-tool:accumulated:v1';
const COLS = [
  { key: 'wineName',  label: 'ワイン名' },
  { key: 'producer',  label: '生産者' },
  { key: 'variety',   label: '品種' },
  { key: 'country',   label: '国' },
  { key: 'region',    label: '産地' },
  { key: 'vintage',   label: 'ヴィンテージ' },
];

let currentContext = null; // { videoId, videoTitle, publishedDate, youtubeUrl }

// ---------- ユーティリティ ----------
function showMsg(text, level = 'info') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + level;
  el.style.display = 'block';
}
function hideMsg() { document.getElementById('msg').style.display = 'none'; }

function setMeta(html) {
  const el = document.getElementById('meta');
  if (!html) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = html;
  el.style.display = 'block';
}

function loadAccum() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveAccum(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toCsv(rows, headers) {
  const q = v => {
    const s = String(v ?? '');
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const lines = [headers.map(h => q(h.label)).join(',')];
  for (const r of rows) lines.push(headers.map(h => q(r[h.key])).join(','));
  return lines.join('\r\n');
}
function toTsv(rows, headers) {
  const clean = v => String(v ?? '').replace(/[\t\r\n]/g, ' ');
  const lines = [headers.map(h => clean(h.label)).join('\t')];
  for (const r of rows) lines.push(headers.map(h => clean(r[h.key])).join('\t'));
  return lines.join('\n');
}

function download(filename, text, mime = 'text/csv;charset=utf-8;') {
  // Excelで文字化けしないようBOM付与（CSV時）
  const bom = mime.startsWith('text/csv') ? '﻿' : '';
  const blob = new Blob([bom + text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); document.body.removeChild(ta); return true; }
    catch (e2) { document.body.removeChild(ta); return false; }
  }
}

// ---------- 抽出テーブル ----------
function renderRow(wine = {}) {
  const tr = document.createElement('tr');
  for (const c of COLS) {
    const td = document.createElement('td');
    const div = document.createElement('div');
    div.contentEditable = 'true';
    div.textContent = wine[c.key] || '';
    div.dataset.key = c.key;
    div.dataset.placeholder = c.label;
    td.appendChild(div);
    tr.appendChild(td);
  }
  const actTd = document.createElement('td');
  actTd.className = 'row-actions';
  const del = document.createElement('button');
  del.textContent = '削除';
  del.onclick = () => tr.remove();
  actTd.appendChild(del);
  tr.appendChild(actTd);
  return tr;
}

function collectRows(tbody) {
  const rows = [];
  for (const tr of tbody.querySelectorAll('tr')) {
    const row = {};
    for (const div of tr.querySelectorAll('[contenteditable]')) {
      row[div.dataset.key] = div.textContent.trim();
    }
    // 全カラム空なら捨てる
    if (COLS.some(c => (row[c.key] || '').length > 0)) rows.push(row);
  }
  return rows;
}

function renderTable(wines) {
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = '';
  const list = (wines && wines.length) ? wines : [{}];
  for (const w of list) tbody.appendChild(renderRow(w));
  document.getElementById('result-card').style.display = 'block';
}

// ---------- 保存済み一覧 ----------
function renderAccum() {
  const arr = loadAccum();
  document.getElementById('accum-count').textContent = arr.length ? `（${arr.length}本）` : '';
  const body = document.getElementById('accum-body');
  if (!arr.length) {
    body.innerHTML = '<div class="empty">まだ保存されたワインはありません。上で抽出してから「この結果を一覧に保存」を押してください。</div>';
    return;
  }
  const headers = [...COLS, { key: 'videoTitle', label: '動画タイトル' }, { key: 'youtubeUrl', label: 'YouTube URL' }, { key: 'savedAt', label: '保存日時' }];
  let html = '<div style="overflow-x:auto"><table><thead><tr>';
  for (const h of headers) html += `<th>${escapeHtml(h.label)}</th>`;
  html += '<th></th></tr></thead><tbody>';
  arr.forEach((r, i) => {
    html += '<tr>';
    for (const h of headers) {
      const v = r[h.key] || '';
      if (h.key === 'youtubeUrl' && v) {
        html += `<td><a href="${escapeHtml(v)}" target="_blank" rel="noopener">開く</a></td>`;
      } else {
        html += `<td>${escapeHtml(v)}</td>`;
      }
    }
    html += `<td class="row-actions"><button data-idx="${i}" class="del-accum">削除</button></td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  body.innerHTML = html;
  body.querySelectorAll('.del-accum').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const cur = loadAccum();
      cur.splice(idx, 1);
      saveAccum(cur);
      renderAccum();
    };
  });
}

// ---------- ハンドラ ----------
async function doExtract() {
  hideMsg();
  const btn = document.getElementById('extract');
  const url = document.getElementById('url').value.trim();
  if (!url) { showMsg('URL を入力してください', 'warn'); return; }

  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>抽出中…';

  try {
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) {
      showMsg(d.error || `エラー (${r.status})`, 'error');
      return;
    }
    currentContext = {
      videoId: d.videoId,
      videoTitle: d.title || '',
      publishedDate: (d.publishedDate || '').slice(0, 10),
      youtubeUrl: `https://www.youtube.com/watch?v=${d.videoId}`,
    };
    const parts = [];
    if (d.title) parts.push(`<strong>${escapeHtml(d.title)}</strong>`);
    if (d.publishedDate) parts.push(`公開: ${escapeHtml(d.publishedDate.slice(0, 10))}`);
    if (d.transcriptLang) parts.push(`字幕: ${escapeHtml(d.transcriptLang)} (${d.transcriptChars || 0}字)`);
    if (d.transcriptNote) parts.push(`<span style="color:var(--warn)">${escapeHtml(d.transcriptNote)}</span>`);
    parts.push(`<a href="${escapeHtml(currentContext.youtubeUrl)}" target="_blank" rel="noopener">動画を開く</a>`);
    setMeta(parts.join(' ／ '));

    if (!d.wines || !d.wines.length) {
      showMsg('ワインを検出できませんでした。手動で行を追加して埋めてください。', 'warn');
      renderTable([]);
    } else {
      showMsg(`${d.wines.length} 本を抽出しました。編集してから「一覧に保存」してください。`, 'info');
      renderTable(d.wines);
    }
  } catch (e) {
    showMsg('通信に失敗しました: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

function saveCurrentToAccum() {
  const rows = collectRows(document.querySelector('#tbl tbody'));
  if (!rows.length) { showMsg('保存する行がありません。', 'warn'); return; }
  const now = new Date();
  const savedAt = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const ctx = currentContext || {};
  const enriched = rows.map(r => ({
    ...r,
    videoTitle: ctx.videoTitle || '',
    publishedDate: ctx.publishedDate || '',
    youtubeUrl: ctx.youtubeUrl || '',
    savedAt,
  }));
  const cur = loadAccum();
  cur.push(...enriched);
  saveAccum(cur);
  renderAccum();
  showMsg(`${rows.length} 本を一覧に追加しました。`, 'info');
}

function downloadCurrent() {
  const rows = collectRows(document.querySelector('#tbl tbody'));
  if (!rows.length) { showMsg('ダウンロードする行がありません。', 'warn'); return; }
  const ctx = currentContext || {};
  const headers = [...COLS, { key: 'videoTitle', label: '動画タイトル' }, { key: 'youtubeUrl', label: 'YouTube URL' }];
  const enriched = rows.map(r => ({ ...r, videoTitle: ctx.videoTitle || '', youtubeUrl: ctx.youtubeUrl || '' }));
  const name = 'wines-' + (ctx.videoId || 'export') + '.csv';
  download(name, toCsv(enriched, headers));
}
async function copyCurrent() {
  const rows = collectRows(document.querySelector('#tbl tbody'));
  if (!rows.length) { showMsg('コピーする行がありません。', 'warn'); return; }
  const ctx = currentContext || {};
  const headers = [...COLS, { key: 'videoTitle', label: '動画タイトル' }, { key: 'youtubeUrl', label: 'YouTube URL' }];
  const enriched = rows.map(r => ({ ...r, videoTitle: ctx.videoTitle || '', youtubeUrl: ctx.youtubeUrl || '' }));
  const ok = await copyToClipboard(toTsv(enriched, headers));
  showMsg(ok ? 'クリップボードにTSVをコピーしました（Google Sheets/Excelに貼付可）' : 'クリップボードへのコピーに失敗しました', ok ? 'info' : 'error');
}

function downloadAll() {
  const arr = loadAccum();
  if (!arr.length) return;
  const headers = [...COLS, { key: 'videoTitle', label: '動画タイトル' }, { key: 'youtubeUrl', label: 'YouTube URL' }, { key: 'publishedDate', label: '公開日' }, { key: 'savedAt', label: '保存日' }];
  download('wines-all.csv', toCsv(arr, headers));
}
async function copyAll() {
  const arr = loadAccum();
  if (!arr.length) return;
  const headers = [...COLS, { key: 'videoTitle', label: '動画タイトル' }, { key: 'youtubeUrl', label: 'YouTube URL' }, { key: 'publishedDate', label: '公開日' }, { key: 'savedAt', label: '保存日' }];
  const ok = await copyToClipboard(toTsv(arr, headers));
  alert(ok ? '全件をTSVでコピーしました' : 'クリップボードへのコピーに失敗');
}
function clearAll() {
  if (!confirm('保存済みのワイン一覧をすべて削除しますか？（この操作は元に戻せません）')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderAccum();
}

// ---------- 初期化 ----------
document.getElementById('extract').addEventListener('click', doExtract);
document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') doExtract(); });
document.getElementById('add-row').addEventListener('click', () => {
  document.querySelector('#tbl tbody').appendChild(renderRow());
});
document.getElementById('save-list').addEventListener('click', saveCurrentToAccum);
document.getElementById('csv-current').addEventListener('click', downloadCurrent);
document.getElementById('copy-current').addEventListener('click', copyCurrent);
document.getElementById('csv-all').addEventListener('click', downloadAll);
document.getElementById('copy-all').addEventListener('click', copyAll);
document.getElementById('clear-all').addEventListener('click', clearAll);
renderAccum();
</script>

</body>
</html>
